version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5

  - package-ecosystem: "docker"
    directory: "/roxs-voting-app/vote"
    schedule:
      interval: "monthly"

  - package-ecosystem: "pip"
    directory: "/roxs-voting-app/vote"
    schedule:
      interval: "monthly"

  - package-ecosystem: "npm"
    directory: "/roxs-voting-app/worker"
    schedule:
      interval: "monthly"
