name: Salud

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  comprobar:
    runs-on: [self-hosted, despliegue]
    steps:
      - name: Contar los contenedores activos
        run: |
          compose="$HOME/despliegue/votacion/docker-compose.yml"
          esperados=$(docker compose -f "$compose" config --services | wc -l)
          activos=$(docker compose -p votacion-prod ps --status running -q | wc -l)
          echo "Contenedores activos: $activos de $esperados"
          test "$activos" -eq "$esperados"

      - name: Comprobar que la votación responde
        run: curl -fsS --max-time 10 http://localhost:8092/ > /dev/null

      - name: Comprobar que los resultados responden
        run: curl -fsS --max-time 10 http://localhost:3003/ > /dev/null

      - name: Comprobar el espacio en disco
        run: |
          uso=$(df --output=pcent / | tail -1 | tr -dc '0-9')
          echo "Disco usado: ${uso}%"
          test "$uso" -lt 85
      - name: Avisar en Discord si algo falló
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          ENLACE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n --arg enlace "$ENLACE" \
            '{content: ("🔴 **La votación no está sana**\nFalló la comprobación horaria en producción.\n" + $enlace)}' \
          | curl -fsS -X POST -H "Content-Type: application/json" -d @- "$WEBHOOK"
