name: Desplegar

on:
  workflow_run:
    workflows: ["Publicar"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      version:
        description: "Etiqueta de la imagen (vacío = la del commit)"
        required: false

jobs:
  desplegar:
    runs-on: [self-hosted, despliegue]
    permissions:
      contents: read
      packages: read
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Autenticarse en GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determinar la versión a desplegar
        id: version
        env:
          ENTRADA: ${{ inputs.version }}
          SHA_PUBLICADO: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ -n "$ENTRADA" ]]; then
            echo "valor=$ENTRADA" >> "$GITHUB_OUTPUT"
          else
            echo "valor=sha-$SHA_PUBLICADO" >> "$GITHUB_OUTPUT"
          fi

      - name: Escribir la contraseña de la bóveda
        env:
          VAULT_PW: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/vault.txt"
          printf '%s' "$VAULT_PW" > "$RUNNER_TEMP/vault.txt"

      - name: Fijar la versión en el repositorio de infraestructura
        env:
          VERSION: ${{ steps.version.outputs.valor }}
        run: |
          cd "$HOME/infra"
          sed -i "s|^version_imagen: .*|version_imagen: $VERSION|" inventories/produccion/group_vars/all/vars.yml
          grep version_imagen inventories/produccion/group_vars/all/vars.yml

      - name: Aplicar el playbook
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          ansible-playbook "$HOME/infra/desplegar.yml" \
            -i "$HOME/infra/inventories/produccion" \
            --vault-password-file "$RUNNER_TEMP/vault.txt"

      - name: Desplegar en el clúster de Kubernetes
        env:
          VERSION: ${{ steps.version.outputs.valor }}
        run: |
          REGISTRO=ghcr.io/camiloandresmartinez/votacion-devops
          for servicio in vote worker result; do
            docker pull "$REGISTRO/$servicio:$VERSION"
            kind load docker-image --name laboratorio "$REGISTRO/$servicio:$VERSION"
          done
          sed -i "s|newTag: .*|newTag: $VERSION|" "$HOME/infra/kubernetes/votacion/overlays/laboratorio/kustomization.yml"
          kubectl apply -k "$HOME/infra/kubernetes/votacion/overlays/laboratorio"
          kubectl rollout status deployment/vote -n votacion --timeout=150s

      - name: Registrar el despliegue en Git
        if: success()
        env:
          VERSION: ${{ steps.version.outputs.valor }}
        run: "$HOME/infra/scripts/registrar-despliegue.sh \"$VERSION\""

      - name: Revertir la versión si el despliegue falló
        if: failure()
        run: |
          cd "$HOME/infra"
          git checkout -- inventories/produccion/group_vars/all/vars.yml kubernetes/votacion/overlays/laboratorio/kustomization.yml

      - name: Borrar la contraseña
        if: always()
        run: rm -f "$RUNNER_TEMP/vault.txt"
