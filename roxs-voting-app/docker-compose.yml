name: votacion

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5

  vote:
    build: ./vote
    image: votacion-vote:1.0
    restart: unless-stopped
    ports: ["8091:8080"]
    environment:
      REDIS_HOST: redis
      DATABASE_HOST: postgres
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  worker:
    build: ./worker
    image: votacion-worker:1.0
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      DATABASE_HOST: postgres
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  result:
    build: ./result
    image: votacion-result:1.0
    restart: unless-stopped
    ports: ["3002:3000"]
    environment:
      DATABASE_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  db-data:
    external: true
    name: votacion-db
